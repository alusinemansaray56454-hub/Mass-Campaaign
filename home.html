<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>ICF-SL Data Collection Portal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #eef2ff;
      font-family: system-ui, 'Segoe UI', 'Inter', 'Helvetica Neue', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 0;
    }

    .phone-wrapper {
      width: 100%;
      max-width: 390px;
      margin: 0 auto;
      background: #eef2ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0.75rem;
    }

    .form-container {
      width: 100%;
      background: #ffffff;
      border-radius: 1.5rem;
      box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(59, 130, 246, 0.1);
      overflow: hidden;
    }

    .light-header {
      background: linear-gradient(105deg, #dbeafe, #eff6ff);
      padding: 1.5rem 1rem 1.2rem 1rem;
      text-align: center;
      border-bottom: 1px solid #bfdbfe;
    }

    .header-title {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: #1e3a8a;
      margin-bottom: 0.3rem;
    }

    .header-sub {
      font-size: 0.7rem;
      color: #3b82f6;
      font-weight: 500;
      margin-bottom: 0.8rem;
    }

    .header-logo {
      height: 50px;
      width: auto;
      display: block;
      margin: 0 auto;
      object-fit: contain;
    }

    .data-form {
      padding: 1.5rem 1rem;
      background: #ffffff;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.875rem;
    }

    .card-link {
      text-decoration: none;
      display: block;
    }

    .card {
      border-radius: 1rem;
      padding: 1rem 0.5rem;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .card:active {
      transform: scale(0.97);
    }

    .card-icon {
      width: 40px;
      height: 40px;
      margin: 0 auto 0.5rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-icon svg {
      width: 32px;
      height: 32px;
      stroke-width: 1.7;
      fill: none;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    /* Card color schemes */
    .card-registration {
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      border: 1px solid #f59e0b;
    }
    .card-registration .card-icon svg { stroke: #d97706; }
    .card-registration .card-title { color: #b45309; }

    .card-distribution {
      background: linear-gradient(135deg, #d1fae5, #a7f3d0);
      border: 1px solid #10b981;
    }
    .card-distribution .card-icon svg { stroke: #059669; }
    .card-distribution .card-title { color: #065f46; }

    .card-dashboard {
      background: linear-gradient(135deg, #ede9fe, #ddd6fe);
      border: 1px solid #8b5cf6;
    }
    .card-dashboard .card-icon svg { stroke: #7c3aed; }
    .card-dashboard .card-title { color: #5b21b6; }

    .card-stock {
      background: linear-gradient(135deg, #fce7f3, #fbcfe8);
      border: 1px solid #ec4899;
    }
    .card-stock .card-icon svg { stroke: #db2777; }
    .card-stock .card-title { color: #be185d; }

    .card-attendance {
      background: linear-gradient(135deg, #ccfbf1, #99f6e4);
      border: 1px solid #14b8a6;
    }
    .card-attendance .card-icon svg { stroke: #0f766e; }
    .card-attendance .card-title { color: #115e59; }

    .card-monitoring {
      background: linear-gradient(135deg, #fee2e2, #fecaca);
      border: 1px solid #ef4444;
    }
    .card-monitoring .card-icon svg { stroke: #dc2626; }
    .card-monitoring .card-title { color: #b91c1c; }

    .light-footer {
      background: linear-gradient(105deg, #dbeafe, #eff6ff);
      border-top: 1px solid #bfdbfe;
      padding: 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.75rem;
      color: #1e3a8a;
      font-weight: 500;
      text-align: center;
      flex-direction: column;
      gap: 0.3rem;
    }

    .footer-text {
      font-family: system-ui, sans-serif;
      letter-spacing: 0.3px;
    }

    .footer-motto {
      font-size: 0.65rem;
      color: #3b82f6;
      font-style: italic;
    }

    @media (max-width: 400px) {
      .phone-wrapper { padding: 0.5rem; }
      .header-title { font-size: 1rem; }
      .header-logo { height: 42px; }
      .data-form { padding: 1.25rem 0.75rem; }
      .cards-grid { gap: 0.7rem; }
      .card { padding: 0.85rem 0.3rem; }
      .card-icon { width: 36px; height: 36px; }
      .card-icon svg { width: 28px; height: 28px; }
      .card-title { font-size: 0.75rem; }
      .footer-motto { font-size: 0.6rem; }
    }
  </style>
</head>
<body>
<div class="phone-wrapper">
  <div class="form-container">
    <!-- HEADER section with logo and company info -->
    <header class="light-header">
      <img src="logo.png" alt="ICF-SL Logo" class="header-logo" onerror="this.style.display='none'">
      <div class="header-title">INFORMATICS CONSULTANCY FIRM-SL (ICF-SL)</div>
      <div class="header-sub">Driving Data-Driven Solution for Health and Development</div>
    </header>

    <!-- BODY — 6 linked cards in 2 columns with SVG icons -->
    <div class="data-form">
      <div class="cards-grid">
        <!-- 1. Registration → reg.html -->
        <a href="reg.html" class="card-link">
          <div class="card card-registration">
            <div class="card-icon">
              <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                <path d="M22 21v-2a4 4 0 0 0-3-3.85" />
              </svg>
            </div>
            <div class="card-title">Registration</div>
          </div>
        </a>

        <!-- 2. Distribution → dist.html -->
        <a href="dist.html" class="card-link">
          <div class="card card-distribution">
            <div class="card-icon">
              <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16v16H4z" />
                <path d="M8 8h8v8H8z" />
                <path d="M12 4v4" />
                <path d="M12 12v4" />
                <path d="M4 12h4" />
                <path d="M16 12h4" />
              </svg>
            </div>
            <div class="card-title">Distribution</div>
          </div>
        </a>

        <!-- 3. Dashboard → dash.html -->
        <a href="dash.html" class="card-link">
          <div class="card card-dashboard">
            <div class="card-icon">
              <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20V10" />
                <path d="M18 20V4" />
                <path d="M6 20v-4" />
                <rect x="2" y="2" width="20" height="20" rx="2" />
              </svg>
            </div>
            <div class="card-title">Dashboard</div>
          </div>
        </a>

        <!-- 4. Stock → stock.html -->
        <a href="stock.html" class="card-link">
          <div class="card card-stock">
            <div class="card-icon">
              <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="7" width="20" height="14" rx="2" />
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
                <path d="M9 11h6" />
                <path d="M9 15h4" />
              </svg>
            </div>
            <div class="card-title">Stock</div>
          </div>
        </a>

        <!-- 5. Attendance → attend.html -->
        <a href="attend.html" class="card-link">
          <div class="card card-attendance">
            <div class="card-icon">
              <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                <path d="M22 21v-2a4 4 0 0 0-3-3.85" />
              </svg>
            </div>
            <div class="card-title">Attendance</div>
          </div>
        </a>

        <!-- 6. Monitoring → monit.html -->
        <a href="monit.html" class="card-link">
          <div class="card card-monitoring">
            <div class="card-icon">
              <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3" />
                <path d="M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0z" />
                <path d="M12 2v2" />
                <path d="M12 20v2" />
                <path d="M2 12h2" />
                <path d="M20 12h2" />
              </svg>
            </div>
            <div class="card-title">Monitoring</div>
          </div>
        </a>
      </div>
    </div>

    <!-- FOOTER with updated company info -->
    <footer class="light-footer">
      <span class="footer-text">INFORMATICS CONSULTANCY FIRM-SL (ICF-SL)</span>
      <span class="footer-motto">Driving Data-Driven Solution for Health and Development</span>
      <span class="footer-text">© 2026 ICF-SL. All rights reserved.</span>
    </footer>
  </div>
</div>
</body>
</html>
