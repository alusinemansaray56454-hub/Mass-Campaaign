<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Data Collection Portal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #eef2ff;
      font-family: system-ui, 'Segoe UI', 'Inter', 'Helvetica Neue', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 0;
    }

    .phone-wrapper {
      width: 100%;
      max-width: 390px;
      margin: 0 auto;
      background: #eef2ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0.75rem;
    }

    .form-container {
      width: 100%;
      background: #ffffff;
      border-radius: 1.5rem;
      box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(59, 130, 246, 0.1);
      overflow: hidden;
    }

    .light-header {
      background: linear-gradient(105deg, #dbeafe, #eff6ff);
      padding: 1.5rem 1rem 1.2rem 1rem;
      text-align: center;
      border-bottom: 1px solid #bfdbfe;
    }

    .header-title {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: #1e3a8a;
      margin-bottom: 0.85rem;
    }

    .header-logo {
      height: 42px;
      width: auto;
      display: block;
      margin: 0 auto;
    }

    .data-form {
      padding: 1.5rem 1rem;
      background: #ffffff;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.875rem;
    }

    .card-wrapper {
      position: relative;
    }

    .card-link {
      text-decoration: none;
      display: block;
      cursor: pointer;
    }

    .card {
      border-radius: 1rem;
      padding: 1rem 0.5rem;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      transition: all 0.2s ease;
      position: relative;
    }

    .card:active {
      transform: scale(0.97);
    }

    .lock-icon {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(2px);
    }

    .lock-icon svg {
      width: 14px;
      height: 14px;
      stroke: white;
      stroke-width: 2;
      fill: none;
    }

    .card-icon {
      width: 40px;
      height: 40px;
      margin: 0 auto 0.5rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-icon svg {
      width: 32px;
      height: 32px;
      stroke-width: 1.7;
      fill: none;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    /* Card color schemes */
    .card-registration {
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      border: 1px solid #f59e0b;
    }
    .card-registration .card-icon svg { stroke: #d97706; }
    .card-registration .card-title { color: #b45309; }

    .card-distribution {
      background: linear-gradient(135deg, #d1fae5, #a7f3d0);
      border: 1px solid #10b981;
    }
    .card-distribution .card-icon svg { stroke: #059669; }
    .card-distribution .card-title { color: #065f46; }

    .card-dashboard {
      background: linear-gradient(135deg, #ede9fe, #ddd6fe);
      border: 1px solid #8b5cf6;
    }
    .card-dashboard .card-icon svg { stroke: #7c3aed; }
    .card-dashboard .card-title { color: #5b21b6; }

    .card-stock {
      background: linear-gradient(135deg, #fce7f3, #fbcfe8);
      border: 1px solid #ec4899;
    }
    .card-stock .card-icon svg { stroke: #db2777; }
    .card-stock .card-title { color: #be185d; }

    .card-attendance {
      background: linear-gradient(135deg, #ccfbf1, #99f6e4);
      border: 1px solid #14b8a6;
    }
    .card-attendance .card-icon svg { stroke: #0f766e; }
    .card-attendance .card-title { color: #115e59; }

    .card-monitoring {
      background: linear-gradient(135deg, #fee2e2, #fecaca);
      border: 1px solid #ef4444;
    }
    .card-monitoring .card-icon svg { stroke: #dc2626; }
    .card-monitoring .card-title { color: #b91c1c; }

    .light-footer {
      background: linear-gradient(105deg, #dbeafe, #eff6ff);
      border-top: 1px solid #bfdbfe;
      padding: 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.8rem;
      color: #1e3a8a;
      font-weight: 500;
    }

    .footer-text {
      font-family: system-ui, sans-serif;
      letter-spacing: 0.3px;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      border-radius: 1.5rem;
      padding: 1.5rem;
      width: 300px;
      max-width: 85%;
      text-align: center;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.2);
    }

    .modal-content h3 {
      color: #1e3a8a;
      margin-bottom: 1rem;
      font-size: 1.2rem;
    }

    .modal-content input {
      width: 100%;
      padding: 0.75rem;
      margin: 0.5rem 0;
      border: 1.5px solid #e2e8f0;
      border-radius: 0.75rem;
      font-size: 0.9rem;
      outline: none;
    }

    .modal-content input:focus {
      border-color: #3b82f6;
    }

    .modal-buttons {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .modal-buttons button {
      flex: 1;
      padding: 0.75rem;
      border: none;
      border-radius: 2rem;
      font-weight: 600;
      cursor: pointer;
    }

    .login-btn {
      background: #3b82f6;
      color: white;
    }

    .cancel-btn {
      background: #e2e8f0;
      color: #1e3a8a;
    }

    .error-msg {
      color: #dc2626;
      font-size: 0.75rem;
      margin-top: 0.5rem;
      display: none;
    }

    /* Iframe Container */
    .iframe-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      z-index: 2000;
      flex-direction: column;
    }

    .iframe-header {
      background: linear-gradient(105deg, #dbeafe, #eff6ff);
      padding: 0.75rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #bfdbfe;
    }

    .iframe-header h4 {
      color: #1e3a8a;
      font-size: 1rem;
    }

    .close-iframe {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #1e3a8a;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-iframe:hover {
      background: rgba(59, 130, 246, 0.1);
    }

    iframe {
      flex: 1;
      width: 100%;
      border: none;
    }

    @media (max-width: 400px) {
      .phone-wrapper { padding: 0.5rem; }
      .header-title { font-size: 1.35rem; }
      .header-logo { height: 38px; }
      .data-form { padding: 1.25rem 0.75rem; }
      .cards-grid { gap: 0.7rem; }
      .card { padding: 0.85rem 0.3rem; }
      .card-icon { width: 36px; height: 36px; }
      .card-icon svg { width: 28px; height: 28px; }
      .card-title { font-size: 0.75rem; }
      .lock-icon { width: 20px; height: 20px; }
      .lock-icon svg { width: 12px; height: 12px; }
    }
  </style>
</head>
<body>
<div class="phone-wrapper">
  <div class="form-container">
    <header class="light-header">
      <div class="header-title">Data Collection</div>
      <img src="logo.png" alt="logo" class="header-logo" onerror="this.style.display='none'">
    </header>

    <div class="data-form">
      <div class="cards-grid">
        <!-- Registration Card -->
        <div class="card-wrapper">
          <div class="card-link" data-module="registration" data-page="reg.html">
            <div class="card card-registration">
              <div class="lock-icon">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>

                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                  <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                  <path d="M22 21v-2a4 4 0 0 0-3-3.85" />
                </svg>

              <div class="card-title">Registration</div>
            </div>
          </div>
        </div>

        <!-- Distribution Card -->
        <div class="card-wrapper">
          <div class="card-link" data-module="distribution" data-page="dist.html">
            <div class="card card-distribution">
              <div class="lock-icon">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </div>
              <div class="card-icon">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16v16H4z" />
                  <path d="M8 8h8v8H8z" />
                  <path d="M12 4v4" />
                  <path d="M12 12v4" />
                  <path d="M4 12h4" />
                  <path d="M16 12h4" />
                </svg>
              </div>
              <div class="card-title">Distribution</div>
            </div>
          </div>
        </div>

        <!-- Dashboard Card -->
        <div class="card-wrapper">
          <div class="card-link" data-module="dashboard" data-page="dash.html">
            <div class="card card-dashboard">
              <div class="lock-icon">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </div>
              <div class="card-icon">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 20V10" />
                  <path d="M18 20V4" />
                  <path d="M6 20v-4" />
                  <rect x="2" y="2" width="20" height="20" rx="2" />
                </svg>
              </div>
              <div class="card-title">Dashboard</div>
            </div>
          </div>
        </div>

        <!-- Stock Card -->
        <div class="card-wrapper">
          <div class="card-link" data-module="stock" data-page="stock.html">
            <div class="card card-stock">
              <div class="lock-icon">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </div>
              <div class="card-icon">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="7" width="20" height="14" rx="2" />
                  <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
                  <path d="M9 11h6" />
                  <path d="M9 15h4" />
                </svg>
              </div>
              <div class="card-title">Stock</div>

        </div>

        <!-- Attendance Card -->
        <div class="card-wrapper">
          <div class="card-link" data-module="attendance" data-page="attend.html">
            <div class="card card-attendance">
              <div class="lock-icon">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>

        <!-- Monitoring Card -->
        <div class="card-wrapper">
          <div class="card-link" data-module="monitoring" data-page="monit.html">
            <div class="card card-monitoring">
              <div class="lock-icon">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>

              </div>
              <div class="card-icon">

    <footer class="light-footer">

</div>

<!-- Login Modal -->
<div id="loginModal" class="modal">
  <div class="modal-content">
    <h3 id="modalTitle">Login Required</h3>
    <input type="text" id="loginUsername" placeholder="Username" autocomplete="off">
    <input type="password" id="loginPassword" placeholder="Password">
    <div id="loginError" class="error-msg">Invalid username or password</div>
    <div class="modal-buttons">
      <button class="cancel-btn" onclick="closeModal()">Cancel</button>
      <button class="login-btn" onclick="attemptLogin()">Login</button>
    </div>
  </div>
</div>

<!-- Iframe Container -->
<div id="iframeContainer" class="iframe-container">
  <div class="iframe-header">
    <h4 id="iframeTitle">Registration</h4>
    <button class="close-iframe" onclick="closeIframe()">✕</button>
  </div>
  <iframe id="contentFrame" src="about:blank"></iframe>
</div>

<script>
  let credentials = {};
  let pendingModule = null;
  let pendingPage = null;

  const modal = document.getElementById('loginModal');
  const loginUsername = document.getElementById('loginUsername');
  const loginPassword = document.getElementById('loginPassword');
  const loginError = document.getElementById('loginError');
  const modalTitle = document.getElementById('modalTitle');
  const iframeContainer = document.getElementById('iframeContainer');
  const contentFrame = document.getElementById('contentFrame');
  const iframeTitle = document.getElementById('iframeTitle');

  // Load credentials from test.csv file
  async function loadCredentials() {
    try {
      const response = await fetch('test.csv');
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      const csvText = await response.text();
      
      const lines = csvText.trim().split('\n');
      
      // First line might be header, check if first line contains 'module' or similar
      let startIndex = 0;
      const firstLine = lines[0].toLowerCase();
      if (firstLine.includes('module') || firstLine.includes('username') || firstLine.includes('password')) {
        startIndex = 1; // Skip header row
      }
      
      for (let i = startIndex; i < lines.length; i++) {
        const line = lines[i].trim();
        if (line === '') continue;
        
        // Handle CSV with possible quotes
        let parts = [];
        let inQuotes = false;
        let currentPart = '';
        
        for (let j = 0; j < line.length; j++) {
          const char = line[j];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            parts.push(currentPart.trim());
            currentPart = '';
          } else {
            currentPart += char;
          }
        }
        parts.push(currentPart.trim());
        
        if (parts.length >= 3) {
          const module = parts[0].replace(/^["']|["']$/g, '').toLowerCase();
          const username = parts[1].replace(/^["']|["']$/g, '');
          const password = parts[2].replace(/^["']|["']$/g, '');
          credentials[module] = { username, password };
        }
      }
      
      console.log('Credentials loaded from test.csv:', Object.keys(credentials));
      
      if (Object.keys(credentials).length === 0) {
        console.warn('No credentials found in test.csv. Please check file format.');
      }
    } catch (error) {
      console.error('Error loading test.csv:', error);
      credentials = {};
    }
  }

  // Show login modal
  function showLogin(moduleName, pageName) {
    if (Object.keys(credentials).length === 0) {
      alert('Please ensure test.csv file exists with valid credentials.\n\nFormat: module,username,password\nExample: registration,admin,pass123');
      return;
    }
    
    pendingModule = moduleName;
    pendingPage = pageName;
    const moduleDisplay = moduleName.charAt(0).toUpperCase() + moduleName.slice(1);
    modalTitle.textContent = `${moduleDisplay} - Login Required`;
    loginUsername.value = '';
    loginPassword.value = '';
    loginError.style.display = 'none';
    modal.style.display = 'flex';
  }

  // Close modal
  function closeModal() {
    modal.style.display = 'none';
    pendingModule = null;
    pendingPage = null;
  }

  // Open iframe with the page
  function openIframe(pageUrl, title) {
    contentFrame.src = pageUrl;
    iframeTitle.textContent = title;
    iframeContainer.style.display = 'flex';
  }

  // Close iframe
  function closeIframe() {
    iframeContainer.style.display = 'none';
    contentFrame.src = 'about:blank';
  }

  // Attempt login
  function attemptLogin() {
    if (!pendingModule) return;
    
    const username = loginUsername.value.trim();
    const password = loginPassword.value;
    const cred = credentials[pendingModule];
    
    if (cred && username === cred.username && password === cred.password) {
      loginError.style.display = 'none';
      closeModal();
      
      const moduleDisplay = pendingModule.charAt(0).toUpperCase() + pendingModule.slice(1);
      openIframe(pendingPage, moduleDisplay);
    } else {
      loginError.style.display = 'block';
    }
  }

  // Attach click event to each card
  const cardLinks = document.querySelectorAll('.card-link');
  cardLinks.forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      const module = link.getAttribute('data-module');
      const page = link.getAttribute('data-page');
      if (module && page) {
        showLogin(module, page);
      }
    });
  });

  // Close modal when clicking outside
  modal.addEventListener('click', (e) => {
    if (e.target === modal) {
      closeModal();
    }
  });

  // Allow Enter key in password field
  loginPassword.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      attemptLogin();
    }
  });

  // Load credentials on page load
  loadCredentials();
</script>
</body>
</html>
